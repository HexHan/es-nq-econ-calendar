name: Update calendar
on:
  schedule:
    # Times are UTC. Futures week: Sun 6pm ET -> Fri 5pm ET.
    - cron: "7,37 * * * 1-5"     # every 30 min, Mon-Fri
    - cron: "7,37 22-23 * * 0"   # every 30 min from Sunday's open
    - cron: "17 */6 * * 0,6"     # every 6 h on weekends
  workflow_dispatch:          # "Run workflow" button
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python econ_calendar.py
      - name: Commit if changed
        run: |
          git config user.name "calendar-bot"
          git config user.email "calendar-bot@users.noreply.github.com"
          git add docs/es-nq-econ.ics
          git diff --cached --quiet || git commit -m "Update calendar"
          git push
